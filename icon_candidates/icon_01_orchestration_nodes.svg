<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#065F46"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5EEAD4"/>
      <stop offset="100%" style="stop-color:#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg1)"/>

  <!-- Connection lines -->
  <line x1="256" y1="160" x2="150" y2="300" stroke="#5EEAD4" stroke-width="6" opacity="0.5"/>
  <line x1="256" y1="160" x2="256" y2="300" stroke="#5EEAD4" stroke-width="6" opacity="0.5"/>
  <line x1="256" y1="160" x2="362" y2="300" stroke="#5EEAD4" stroke-width="6" opacity="0.5"/>
  <line x1="150" y1="300" x2="200" y2="400" stroke="#5EEAD4" stroke-width="4" opacity="0.3"/>
  <line x1="150" y1="300" x2="100" y2="400" stroke="#5EEAD4" stroke-width="4" opacity="0.3"/>
  <line x1="256" y1="300" x2="256" y2="400" stroke="#5EEAD4" stroke-width="4" opacity="0.3"/>
  <line x1="362" y1="300" x2="362" y2="400" stroke="#5EEAD4" stroke-width="4" opacity="0.3"/>
  <line x1="362" y1="300" x2="412" y2="400" stroke="#5EEAD4" stroke-width="4" opacity="0.3"/>

  <!-- Center orchestrator node (large) -->
  <circle cx="256" cy="160" r="42" fill="url(#glow1)" opacity="0.9"/>
  <circle cx="256" cy="160" r="28" fill="white" opacity="0.95"/>
  <!-- AI symbol in center -->
  <text x="256" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0D9488" text-anchor="middle">AI</text>

  <!-- Mid-level agent nodes -->
  <circle cx="150" cy="300" r="30" fill="#2DD4BF" opacity="0.85"/>
  <circle cx="150" cy="300" r="18" fill="white" opacity="0.9"/>
  <text x="150" y="306" font-family="Arial" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="middle">C</text>

  <circle cx="256" cy="300" r="30" fill="#2DD4BF" opacity="0.85"/>
  <circle cx="256" cy="300" r="18" fill="white" opacity="0.9"/>
  <text x="256" y="306" font-family="Arial" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="middle">X</text>

  <circle cx="362" cy="300" r="30" fill="#2DD4BF" opacity="0.85"/>
  <circle cx="362" cy="300" r="18" fill="white" opacity="0.9"/>
  <text x="362" y="306" font-family="Arial" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="middle">G</text>

  <!-- Bottom result nodes (small) -->
  <circle cx="100" cy="400" r="14" fill="#99F6E4" opacity="0.6"/>
  <circle cx="200" cy="400" r="14" fill="#99F6E4" opacity="0.6"/>
  <circle cx="256" cy="400" r="14" fill="#99F6E4" opacity="0.6"/>
  <circle cx="362" cy="400" r="14" fill="#99F6E4" opacity="0.6"/>
  <circle cx="412" cy="400" r="14" fill="#99F6E4" opacity="0.6"/>
</svg>
