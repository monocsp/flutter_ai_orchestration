<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#2DD4BF"/>
    </linearGradient>
    <linearGradient id="amber3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <linearGradient id="violet3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg3)"/>

  <!-- Step 1 indicator -->
  <rect x="80" y="100" width="140" height="50" rx="25" fill="url(#teal3)" opacity="0.9"/>
  <text x="150" y="132" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Step 1</text>

  <!-- Arrow 1→2 -->
  <path d="M220,125 C270,125 240,200 270,200" fill="none" stroke="#5EEAD4" stroke-width="3" opacity="0.6"/>
  <polygon points="270,193 270,207 285,200" fill="#5EEAD4" opacity="0.6"/>

  <!-- Step 2 indicator -->
  <rect x="285" y="175" width="140" height="50" rx="25" fill="url(#amber3)" opacity="0.9"/>
  <text x="355" y="207" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Step 2</text>

  <!-- Arrow 2→3 -->
  <path d="M355,225 C355,260 150,240 150,275" fill="none" stroke="#FBBF24" stroke-width="3" opacity="0.6"/>
  <polygon points="143,275 157,275 150,290" fill="#FBBF24" opacity="0.6"/>

  <!-- Step 3 indicator -->
  <rect x="80" y="290" width="140" height="50" rx="25" fill="url(#violet3)" opacity="0.9"/>
  <text x="150" y="322" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Step 3</text>

  <!-- Arrow 3→result -->
  <path d="M220,315 C270,315 240,380 270,380" fill="none" stroke="#A78BFA" stroke-width="3" opacity="0.6"/>
  <polygon points="270,373 270,387 285,380" fill="#A78BFA" opacity="0.6"/>

  <!-- Result box -->
  <rect x="285" y="355" width="150" height="55" rx="12" fill="none" stroke="#5EEAD4" stroke-width="2.5" opacity="0.7"/>
  <rect x="285" y="355" width="150" height="55" rx="12" fill="#5EEAD4" opacity="0.1"/>

  <!-- Result icon - document with checkmark -->
  <rect x="310" y="365" width="24" height="30" rx="3" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  <polyline points="315,380 320,386 330,374" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
  <text x="345" y="388" font-family="Arial" font-size="16" font-weight="600" fill="white" opacity="0.9">Result</text>

  <!-- Decorative - floating AI particles -->
  <circle cx="400" cy="110" r="4" fill="#5EEAD4" opacity="0.4"/>
  <circle cx="420" cy="140" r="3" fill="#FBBF24" opacity="0.3"/>
  <circle cx="380" cy="130" r="2.5" fill="#A78BFA" opacity="0.35"/>
  <circle cx="100" y="400" r="3" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="70" y="380" r="2" fill="#FBBF24" opacity="0.25"/>

  <!-- Top-left branding mark -->
  <text x="90" y="65" font-family="Arial" font-size="14" font-weight="bold" fill="#5EEAD4" opacity="0.5">AI</text>
  <line x1="110" y1="58" x2="140" y2="58" stroke="#5EEAD4" stroke-width="1.5" opacity="0.3"/>
</svg>
